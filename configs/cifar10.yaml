# CIFAR-10: still images, so the encoder makes the time axis by repeating
# each image T times. Exists so the tool is exercised on something other than
# DVS128 Gesture: the search reads the channels (3), size (32x32) and class
# count (10) from the dataset, allows left-right flips because a mirrored
# photo keeps its label, and searches 1 to 4 bits per pixel.

run:
  name: cifar10
  results_dir: results/cifar10

dataset:
  name: cifar10
  root: ./data/cifar10
  download: true

encoding:
  # Each pixel as an integer level, 0 to 2**bits - 1, sent on `bits` axons.
  # "direct" (the raw analog value) trains faster but no axon carries it, so
  # its networks cannot be deployed.
  coding: levels
  T: 8                   # still images need fewer steps than event data
  resize_to: null        # 32x32x3 = 3,072 axons per bit, inside the 16,000 limit

search:
  trials: 200
  epochs: 40
  grace_period: 8
  balanced_trials: 48
  finalists: 3
  finalist_seeds: 3
  T_choices: [4, 8, 16]
  target: 0.90
  space: per_layer
  gpu_fraction: 0.25

objective:
  mode: pareto           # report the accuracy/SynOps front and choose after
