# DVS128 Gesture: the configuration this project was built around.
# Every narrowed range carries the statistic that narrowed it.

run:
  name: dvs128
  results_dir: results/dvs128

dataset:
  name: dvs128
  root: /local_disk/$USER/DVS128Gesture

encoding:
  coding: passthrough    # already events; resize and binarize only
  T: 16
  resize_to: 64          # native 128x128 needs 32,768 axons against a limit of 16,383

search:
  trials: 400
  # SEARCH horizon, not the final one. ASHA prunes on early performance, so a
  # long budget here spends most of its compute on runs that get killed anyway,
  # and any rung placed before grokking would begin is a coin flip on exactly
  # the runs a grokking hunt wants to keep. Those are different questions, so
  # they get different runs: this one picks architectures at a horizon where
  # early performance is a fair signal, and the survivors are then retrained
  # long with no pruning at all (main.py single --from-best --epochs 300).
  epochs: 60
  batch_size: 16
  # One frame cache per value, built sequentially before Ray starts. Each takes
  # tens of CPU minutes the first time and is then reused by every run.
  T_choices: [8, 16]
  # Rungs land at grace_period * reduction_factor^k, so 10, 30, 60 here. Of 400
  # trials roughly 133 clear the first cut, 44 the second, and those run to the
  # full 60. Must stay > 1 regardless: cosine and one-cycle both improve late.
  grace_period: 10
  reduction_factor: 3
  target: 0.975          # published SNN accuracy on this task is 97-99%
  # per_layer samples kernel, channels and downsampling INDEPENDENTLY per conv
  # layer. "uniform" shares one of each across the whole stack, which cannot
  # express two different widths, so the paper's best DVS model -- C(6) into
  # C(16) -- was unreachable no matter how wide the channel range got.
  #
  # Uniform is a subset of this: a per-layer trial can sample the same values
  # for every layer. So nothing is lost, but the space is much larger and wants
  # a trial budget to match.
  space: per_layer
  # Knobs every trial must use, rather than sampling on/off. Naming one removes
  # its `use_*` switch, so the search stops asking whether it helps and starts
  # asking how much of it to use.
  #
  # Both ranges reach far enough down to be nearly inactive (conv_dropout 0.05,
  # rate_penalty 1e-4), so forcing them on does not force them to matter. It
  # removes the baseline, though: with no trials running without them, this run
  # cannot answer whether they help. Run tools/hpo_analysis.py on the previous
  # search for that, where each was a coin flip across ~318 trained trials.
  # conv_dropout IS the spatiotemporal dropout: spikingjelly's Dropout on the
  # spikes leaving each conv block, mask held for the whole clip.
  #
  # rate_penalty previously penalized every spiking layer INCLUDING the output,
  # whose spikes are the prediction, so it was telling the network not to
  # answer. 92% of those trials died at the first rung at 0.332 accuracy
  # against 0.626 without it. The output layer is now excluded. Verify that fix
  # with one short run before trusting a whole search to it:
  #
  #   python main.py single -c configs/dvs128.yaml --from-best <best.json> \
  #       --epochs 60 --train rate_penalty=0.01 --results-dir results/rp_check
  #
  # Epoch 9 should land near 0.6, not near 0.33.
  require: [conv_dropout, rate_penalty]
  # MEASURED, not estimated. A 400-trial run at 0.03125 put 27 trials on one
  # L40S and filled 44.4 of 44.42 GiB; 266 of 400 died of CUDA OOM. Per trial
  # the range was 0.7 to 3.6 GiB, averaging 1.65 -- far above the parameter
  # count, because each process also carries a CUDA context, cuDNN workspace
  # and allocator slack. Size for the 3.6 GiB tail, not the average:
  # 8 x 3.6 = 29 GiB leaves headroom, 16 would not.
  gpu_fraction: 0.125

train:
  # Length of the quantized phase's LR schedule, independent of the epoch
  # budget. Without it the grid-phase cosine stretches across whatever the
  # budget leaves over, holding the learning rate high while the weights are
  # meant to be settling onto the INT16 grid. That is what took the same
  # configuration from 0.892 at 40 epochs to 0.756 at 100. Set it and the decay
  # finishes in this many epochs whatever the budget, so the long runs the
  # grokking question needs stay safe.
  qat_schedule_epochs: 40

objective:
  mode: accuracy         # switch to pareto once SynOps have been recorded once
