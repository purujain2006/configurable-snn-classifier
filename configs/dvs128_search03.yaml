# Search 03. Same space as dvs128.yaml, with what changed since Search 02:
#   * fan-in counts the neurons in front of each average pool (4x per 2x2 pool),
#     so every proposal fits the chip; rank1 itself would now be rejected
#   * tau only takes powers of two, and weight decay no longer moves tau,
#     thresholds or BatchNorm
#   * bias_mode is searched: threshold folding or bias neurons
#   * validation holds out four whole subjects, like the test set does
#   * every trial is checked clip by clip on IntegerSim (sim_val_accuracy,
#     sim_disagreements)
#   * pool_type is searched: average (folded) or max (OR neurons)
#   * a balanced block runs every combination of the on/off choices first
# Its own results directory, because the leaderboard columns changed and
# appending to an old leaderboard.csv misaligns them.

# DVS128 Gesture: the configuration this project was built around.
# Every narrowed range carries the statistic that narrowed it.

run:
  name: dvs128_search03
  results_dir: results/dvs128_search03

dataset:
  name: dvs128
  root: /local_disk/$USER/DVS128Gesture

encoding:
  coding: passthrough    # already events; resize and binarize only
  T: 16
  resize_to: 64          # native 128x128 needs 32,768 axons against a limit of 16,000

search:
  trials: 400
  # The first 96 trials are a balanced block: every combination of pooling
  # (none, average, max as OR neurons), bias (threshold, bias neurons), head
  # (flatten, GAP), conv dropout (off, on) and firing-rate penalty (off, on),
  # twice, with everything else sampled at random. Each option then gets the
  # same number of trials and can be compared fairly. Optuna steers only after
  # them, for the remaining 304 (+10 more random trials first).
  balanced_repeats: 2
  startup_trials: 10
  # Longer and more forgiving than Search 02 (60 epochs, first cut at 10), so
  # slow starters such as GAP heads and regularized networks get a fair run.
  # Two ASHA brackets: half the trials are first judged at epoch 20 (then 60),
  # the other half not until epoch 60.
  epochs: 80
  grace_period: 20
  reduction_factor: 3
  brackets: 2
  batch_size: 16
  # One frame cache per value, built before Ray starts.
  T_choices: [8, 16]
  target: 0.975          # published SNN accuracy on this task is 97-99%
  # each conv layer samples its own kernel, channels and downsampling
  space: per_layer
  # Nothing is forced on. Conv dropout and the firing-rate penalty are sampled
  # on and off like everything else. The penalty skips the output layer, whose
  # spikes are the prediction; dropout never touches the output layer's spikes.
  # MEASURED, not estimated. A 400-trial run at 0.03125 put 27 trials on one
  # L40S and filled 44.4 of 44.42 GiB; 266 of 400 died of CUDA OOM. Per trial
  # the range was 0.7 to 3.6 GiB, averaging 1.65 -- far above the parameter
  # count, because each process also carries a CUDA context, cuDNN workspace
  # and allocator slack. Size for the 3.6 GiB tail, not the average:
  # 8 x 3.6 = 29 GiB leaves headroom, 16 would not.
  gpu_fraction: 0.125

train:
  # Length of the quantized phase's LR schedule, independent of the epoch
  # budget. Without it the grid-phase cosine stretches across whatever the
  # budget leaves over, holding the learning rate high while the weights are
  # meant to be settling onto the INT16 grid. That is what took the same
  # configuration from 0.892 at 40 epochs to 0.756 at 100. Set it and the decay
  # finishes in this many epochs whatever the budget, so the long runs the
  # grokking question needs stay safe.
  qat_schedule_epochs: 40

objective:
  mode: accuracy         # switch to pareto once SynOps have been recorded once
